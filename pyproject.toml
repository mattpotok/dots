[project]
name = "dots-py"
version = "0.1.0"
description = "Experimental Python setup tool for this dotfiles repository"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "ty>=0.0.75",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
