; Gammastep configuration file. Adjust the color temperature of the screen.

[general]
; Set the day and night temperatures.
temp-day=6500
temp-night=4000

; Gradually fade between temperatures.
fade=1

; Use X11 RandR while i3/X11 is the active session. Change this to `wayland`
; when migrating to Sway.
adjustment-method=randr

; Fixed coordinates avoid requiring a GeoClue location provider.
location-provider=manual

[manual]
lat=42
lon=-71
