# i3status-rust configuration for i3bar.
#
# The sound block uses the default PulseAudio/PipeWire sink. Scroll changes the
# volume, right-click toggles mute, and left-click opens pavucontrol for output
# selection and per-application routing.

[theme]
theme = "plain"

[theme.overrides]
end_separator = "|"

[icons]
icons = "none"

[[block]]
block = "sound"
driver = "auto"
format = " AUDIO {$volume.eng(w:2) |muted}"
headphones_indicator = true

[[block.click]]
button = "left"
cmd = "pavucontrol"

[[block]]
block = "cpu"
interval = 5

[[block]]
block = "custom"
command = "~/.config/i3status-rust/bin/memory-status"
interval = 5
format = " MEM $text "

[[block]]
block = "disk_space"
path = "/"
info_type = "available"
interval = 60

[[block]]
block = "weather"
if_command = "test -n \"$OPENWEATHERMAP_API_KEY\""
format = " WEATHER $weather $temp "
error_format = " WEATHER unavailable "
interval = 1800
autolocate = true
autolocate_interval = 21600
[block.service]
name = "openweathermap"
units = "metric"

[[block.click]]
button = "left"
update = true

[[block]]
block = "hueshift"
if_command = "command -v gammastep"
hue_shifter = "gammastep"
format = " HUE $temperature K "
step = 100
click_temp = 4000

[[block]]
block = "battery"
format = " BAT $percentage DIS {$time_remaining.dur(hms:true, min_unit:m) |}"
charging_format = " BAT $percentage CHR {$time_remaining.dur(hms:true, min_unit:m) |}"
full_format = " BAT $percentage FUL "
full_threshold = 100
not_charging_format = " BAT $percentage UNK "
empty_format = " BAT $percentage UNK "
missing_format = ""

[[block]]
block = "custom"
command = "~/.config/i3status-rust/bin/battery-capacity"
interval = 3600
format = " CAP $text "

[[block]]
block = "keyboard_layout"
[block.mappings]
"us (N/A)" = "KEY QWR"
"us (dvp)" = "KEY DVP"

[[block.click]]
button = "left"
cmd = "~/.config/i3status-rust/bin/toggle-keyboard-layout"

[[block]]
block = "time"
interval = 60
format = " $timestamp.datetime(f:'%Y-%m-%d %H:%M') "

[[block.click]]
button = "left"
cmd = "gsimplecal"
